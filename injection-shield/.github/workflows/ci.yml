name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  HERMES_HOME: /tmp/hermes-ci-home

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install bandit mypy "ruff==0.16.4" build pytest-cov

      - name: Run tests with coverage
        run: pytest -v --cov=injection_shield --cov-report=xml

      - name: Security scan (bandit)
        run: bandit -r . -lll -x './.venv,./tests,./build,./dist,./evidence,./scripts,./tmp_mypy'

      - name: Type check (mypy)
        run: bash scripts/run_mypy_ci.sh --install-types --non-interactive || bash scripts/run_mypy_ci.sh --ignore-missing-imports

      - name: Lint check (ruff)
        run: ruff check .

      - name: Build wheel + sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/
