name: injection-shield
version: "0.8.2"
description: >-
  Injection-Shield — Defends Hermes agents against prompt-injection attacks
  via tool outputs and untrusted content. Validates LLM responses, audits
  risky tool calls. Modes: audit / enforcement.
api: dashboard/plugin_api.py
requires_env:
  - INJECTION_SHIELD_TELEGRAM_BOT_TOKEN
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - transform_tool_result
  - transform_llm_output
author: Injection-Shield Maintainers
license: MIT
requires_hermes: ">=0.21.5"
# Hook execution priority: larger numbers run later.
# NOTE (review t_c0a50b6f F-3): hook_priority is DECLARATIVE ONLY — Hermes
# v0.23 does NOT consume it (verified: zero code references in the core);
# dispatch order follows plugin load order (alphabetical), which currently
# yields "injection before privacy" by name luck, not by contract. Upstream
# ordering support is proposed together with the pre_llm_call `provider`
# kwarg in a separate hermes-agent PR.
# pre_llm_call must run BEFORE privacy-shield (priority 200) so the
# prompt-injection firewall sees the original user/tool content before
# PII pseudonymization masks it as TOKEN_<TYPE>_<hash>_<counter>.
# transform_llm_output (150) runs BEFORE privacy-shield's transform_llm_output
# (200) so a suppressed output never reaches the token-restore pass;
# post_llm_call runs AFTER that restore pass as a pure audit/observer layer.
hook_priority:
  pre_llm_call: 100
  post_tool_call: 150
  transform_tool_result: 100
  transform_llm_output: 150
  post_llm_call: 200
# Telegram alerting is opt-in. To enable alerts set ``chat_id`` in
# ~/.hermes/config.yaml under plugins.entries.injection-shield.telegram
# OR export INJECTION_SHIELD_TELEGRAM_CHAT_ID in the shell. The bot token
# is the plugin's own secret INJECTION_SHIELD_TELEGRAM_BOT_TOKEN
# (requires_env; resolved via agent.secret_scope) — never the gateway's
# TELEGRAM_BOT_TOKEN.
settings:
  - name: telegram.enabled
    type: bool
    default: false
    description: "Telegram alerting is opt-in. Default false (Privacy by Default)."
  - name: telegram.chat_id
    type: int
    default: null
    description: "Telegram target chat id. If unset (and env-var INJECTION_SHIELD_TELEGRAM_CHAT_ID unset), alerting stays disabled."
  - name: telegram.min_severity
    type: string
    default: "medium"
    description: "Minimum severity that triggers a Telegram alert."
  - name: audit_log_max_bytes
    type: int
    default: 10485760
    description: "Rotate audit log when it exceeds this size (default 10 MiB)."
  - name: audit_log_backup_count
    type: int
    default: 5
    description: "Number of rotated audit log backups to keep."
  - name: audit_log_retention_days
    type: int
    default: 90
    description: "DSGVO Art. 5(1)(e) Speicherbegrenzung — auto-prune entries older than this many days."
