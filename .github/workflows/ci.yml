name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HERMES_HOME: /tmp/hermes-ci-home

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [privacy-shield, injection-shield]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (privacy-shield OCR)
        if: matrix.package == 'privacy-shield'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Compile check (both packages, un-masked)
        run: python -m compileall -q privacy-shield/ injection-shield/

      - name: Install package ([test] extra — real supply gate)
        run: pip install -e "${{ matrix.package }}[test]"

      - name: Run pytest (real gate — failure fails CI)
        working-directory: ${{ matrix.package }}
        env:
          PRIVACY_SHIELD_CI: ${{ matrix.package == 'privacy-shield' && '1' || '' }}
        run: pytest tests/ --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff==0.16.4"

      - name: Ruff check (injection-shield, per-package config)
        run: ruff check injection-shield

      # privacy-shield ships no [tool.ruff] config; its released CI pins an
      # explicit file list. Ruff defaults on the whole package tree produce
      # 300+ style findings, so the known-good list stays until a package
      # lint config exists.
      - name: Ruff check (privacy-shield, explicit list)
        run: |
          ruff check \
            privacy-shield/plugin.py \
            privacy-shield/pseudonymizer.py \
            privacy-shield/metrics.py \
            privacy-shield/lifecycle.py \
            privacy-shield/log_utils.py \
            privacy-shield/scripts/enable_all_profiles.py \
            privacy-shield/tests/test_graceful_shutdown.py \
            privacy-shield/tests/test_metrics.py \
            privacy-shield/tests/test_enable_all_profiles.py

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install mypy, stubs and both packages
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-PyYAML types-setuptools
          pip install -e "privacy-shield[test]" -e "injection-shield[test]"

      - name: Type check (injection-shield)
        run: |
          bash injection-shield/scripts/run_mypy_ci.sh --install-types --non-interactive \
            || bash injection-shield/scripts/run_mypy_ci.sh --ignore-missing-imports

      - name: Type check (privacy-shield, --strict via mypy_pkg symlink)
        working-directory: privacy-shield
        run: |
          mkdir -p /tmp/mypy_pkg
          ln -sfn "$PWD" /tmp/mypy_pkg/privacy_shield
          MYPYPATH=/tmp/mypy_pkg TOKEN_BIC_905570f3cc_000=/tmp/mypy_pkg mypy --strict --ignore-missing-imports \
            --exclude '/(tests|scripts|docs|build)/' -p privacy_shield

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install bandit
        run: pip install "bandit[toml]"

      - name: Bandit (privacy-shield)
        run: |
          bandit -r privacy-shield -lll \
            -x './privacy-shield/.venv,./privacy-shield/tests,./privacy-shield/build,./privacy-shield/dist,./privacy-shield/evidence,./privacy-shield/scripts,./privacy-shield/tmp_mypy'

      - name: Bandit (injection-shield)
        run: |
          bandit -r injection-shield -lll \
            -x './injection-shield/.venv,./injection-shield/tests,./injection-shield/build,./injection-shield/dist,./injection-shield/evidence,./injection-shield/scripts,./injection-shield/tmp_mypy'

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [privacy-shield, injection-shield]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build ${{ matrix.package }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: ${{ matrix.package }}/dist/
