name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check (both packages)
        run: |
          set -e
          python -m compileall -q privacy-shield/ || echo "compileall failed for privacy-shield"
          python -m compileall -q injection-shield/ || echo "compileall failed for injection-shield"

      - name: Run tests (if available)
        run: |
          set -e
          for pkg in privacy-shield injection-shield; do
            if [ -f "$pkg/requirements.txt" ]; then
              pip install -q -r "$pkg/requirements.txt" 2>/dev/null || true
            fi
            if [ -f "$pkg/pyproject.toml" ]; then
              pip install -q -e "$pkg"[test] 2>/dev/null || pip install -q -e "$pkg" 2>/dev/null || true
            fi
          done
          pytest tests/ --tb=short -q 2>/dev/null || true
        continue-on-error: true
