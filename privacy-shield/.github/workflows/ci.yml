name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring,desktop]"

      - name: Run tests
        env:
          PRIVACY_SHIELD_CI: "1"
        run: python -m pytest tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring,desktop]"

      - name: Lint with ruff
        run: ruff check plugin.py pseudonymizer.py metrics.py lifecycle.py log_utils.py scripts/enable_all_profiles.py tests/test_graceful_shutdown.py tests/test_metrics.py tests/test_enable_all_profiles.py

      - name: Format check with ruff
        run: ruff format --check plugin.py pseudonymizer.py metrics.py lifecycle.py log_utils.py scripts/enable_all_profiles.py tests/test_graceful_shutdown.py tests/test_metrics.py tests/test_enable_all_profiles.py

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring,desktop]"

      - name: Type-check with mypy
        run: |
          mkdir -p /tmp/mypy_pkg
          ln -s "$PWD" /tmp/mypy_pkg/privacy_shield
          MYPYPATH=/tmp/mypy_pkg mypy --strict --ignore-missing-imports --exclude '/(tests|scripts|docs|build)/' -p privacy_shield

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring,desktop]"

      - name: Security scan with bandit
        run: bandit -r . -x tests/,build/ -f json -o bandit-report.json || true

      - name: Print bandit report
        run: cat bandit-report.json
        if: always()
