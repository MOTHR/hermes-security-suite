[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-shield"
dynamic = ["version"]
description = "PII pseudonymization for Hermes — DSGVO & EU AI Act compliance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Privacy-Shield Maintainers"}]
dependencies = [
    "click>=8.0,<9.0",
    "cryptography>=41.0.0,<51.0",
    "pyyaml>=6.0,<7.0",
    "pdfplumber>=0.10.0,<0.12.0",
    "reportlab>=4.0.0,<6.0",
    "Pillow>=10.0.0,<13.0",
    "pytesseract>=0.3.10,<0.4.0",
    "pillow-heif>=0.16.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<3.0",
    "types-setuptools>=70.0,<85.0",
    "bandit[toml]>=1.7.0,<2.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pypdf>=4.0",
    "coverage>=7.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
]
desktop = [
    "fastapi>=0.110.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
]
# explicit `test` group — mirrors the canonical ``pip install -e .[test]``
# workflow (parity with injection-shield). ``dev`` is kept for tooling callers.
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "fastapi>=0.110.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "pypdf>=4.0",  # audit-PDF tests import pypdf directly
]

[project.scripts]
privacy-shield = "privacy_shield.cli:main"

[tool.setuptools]
include-package-data = true
packages = [
    "privacy_shield",
    "privacy_shield.audit",
    "privacy_shield.dashboard",
    "privacy_shield.detectors",
    "privacy_shield.migrations",
    "privacy_shield.preprocessors",
]

[tool.setuptools.dynamic]
version = {attr = "privacy_shield.__version__"}

[tool.setuptools.package-dir]
"privacy_shield" = "."
"privacy_shield.audit" = "audit"
"privacy_shield.dashboard" = "dashboard"
"privacy_shield.detectors" = "detectors"
"privacy_shield.migrations" = "migrations"
"privacy_shield.preprocessors" = "preprocessors"

[tool.setuptools.package-data]
privacy_shield = ["plugin.yaml", "config/audit_articles.yaml"]
"privacy_shield.audit" = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "docs/"]
warn_unused_ignores = true

# dashboard/plugin_api.py loads the plugin root dynamically (self-load fix,
# 499d4cd) via importlib spec loading, so the config classes/aliases resolve to
# Any for mypy. Scope the resulting codes to this module only.
[[tool.mypy.overrides]]
module = "privacy_shield.dashboard.plugin_api"
disable_error_code = ["valid-type", "attr-defined"]
