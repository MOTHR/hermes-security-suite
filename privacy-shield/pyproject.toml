[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-shield"
dynamic = ["version"]
description = "PII pseudonymization for Hermes/Higgins — DSGVO & EU AI Act compliance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Privacy-Shield Maintainers"}]
dependencies = [
    "click>=8.0",
    "cryptography>=41.0.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.10.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pillow-heif>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-setuptools>=70.0",
    "bandit[toml]>=1.7.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pypdf>=4.0",
    "coverage>=7.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
]
desktop = [
    "fastapi>=0.110.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
]

[project.scripts]
privacy-shield = "privacy_shield.cli:main"

[tool.setuptools]
include-package-data = true
packages = [
    "privacy_shield",
    "privacy_shield.audit",
    "privacy_shield.dashboard",
    "privacy_shield.detectors",
    "privacy_shield.migrations",
    "privacy_shield.preprocessors",
]

[tool.setuptools.dynamic]
version = {attr = "privacy_shield.__version__"}

[tool.setuptools.package-dir]
"privacy_shield" = "."
"privacy_shield.audit" = "audit"
"privacy_shield.dashboard" = "dashboard"
"privacy_shield.detectors" = "detectors"
"privacy_shield.migrations" = "migrations"
"privacy_shield.preprocessors" = "preprocessors"

[tool.setuptools.package-data]
privacy_shield = ["plugin.yaml"]
"privacy_shield.audit" = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "docs/"]
warn_unused_ignores = true
